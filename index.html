<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

/* TRADUÇÕES */

const translations = {

pt:{

formTitle:"📅 Novo Agendamento",

save:"Salvar Agendamento",

alertFill:"Preencha todos os campos!",

alertSaved:"Agendamento salvo!",

deleteConfirm:"Deseja excluir este evento?"
},

en:{

formTitle:"📅 New Appointment",

save:"Save Appointment",

alertFill:"Fill all fields!",

alertSaved:"Appointment saved!",

deleteConfirm:"Do you want to delete this event?"
}

};

let currentLang = "pt";

document.getElementById("languageSwitcher")
.addEventListener("change",function(){

currentLang = this.value;

updateLanguage();

});

/* IDIOMA */

function updateLanguage(){

document.getElementById("formTitle")
.innerText =
translations[currentLang].formTitle;

document.getElementById("saveButton")
.innerText =
translations[currentLang].save;

calendar.setOption(
"locale",
currentLang === "pt" ? "pt-br" : "en"
);

}

/* CALENDÁRIO */

let calendar;

document.addEventListener('DOMContentLoaded',function(){

const calendarEl =
document.getElementById('calendar');

calendar =
new FullCalendar.Calendar(calendarEl,{

initialView:'timeGridWeek',

locale:'pt-br',

editable:true,

selectable:true,

allDaySlot:false,

slotMinTime:"08:00:00",

slotMaxTime:"22:00:00",

slotDuration:"00:30:00",

height:"auto",

headerToolbar:{

left:'prev,next today',

center:'title',

right:'dayGridMonth,timeGridWeek,timeGridDay'
},

events:
JSON.parse(localStorage.getItem("eventos")) || [],

/* AO CLICAR NO HORÁRIO */

select:function(info){

document.getElementById("start").value =
formatDateTimeLocal(info.start);

},

/* MOSTRAR NOME NO EVENTO */

eventContent:function(arg){

return {

html: `
<div style="padding:5px;">
<strong>${arg.event.title}</strong>
</div>
`

};

},

eventClick:function(info){

if(confirm(translations[currentLang].deleteConfirm)){

info.event.remove();

saveEvents();
}

},

eventChange:function(){

saveEvents();
}

});

calendar.render();

});

/* FORMATAR DATA */

function formatDateTimeLocal(date){

const pad = n => n.toString().padStart(2,'0');

return `${date.getFullYear()}-${
pad(date.getMonth()+1)}-${
pad(date.getDate())}T${
pad(date.getHours())}:${
pad(date.getMinutes())}`;

}

/* ADICIONAR EVENTO */

function addEvent(){

const clientName =
document.getElementById("clientName").value;

const clientPhone =
document.getElementById("clientPhone").value;

const title =
document.getElementById("title").value;

const start =
document.getElementById("start").value;

if(
clientName === "" ||
clientPhone === "" ||
title === "" ||
start === ""
){

alert(
translations[currentLang].alertFill
);

return;
}

/* TEXTO EVENTO */

const fullTitle =

`${title}
👤 ${clientName}`;

/* ADICIONAR */

calendar.addEvent({

title:fullTitle,

start:start,

color:"#ff4d4d"
});

saveEvents();

/* WHATSAPP */

sendWhatsAppToOwner(
clientName,
clientPhone,
title,
start
);

alert(
translations[currentLang].alertSaved
);

/* LIMPAR */

document.getElementById("clientName").value = "";

document.getElementById("clientPhone").value = "";

document.getElementById("title").value = "";

document.getElementById("start").value = "";

}

/* SALVAR */

function saveEvents(){

const events = [];

calendar.getEvents().forEach(event => {

events.push({

title:event.title,

start:event.start,

color:"#ff4d4d"

});

});

localStorage.setItem(
"eventos",
JSON.stringify(events)
);

}

/* WHATSAPP */

function sendWhatsAppToOwner(
clientName,
clientPhone,
title,
date
){

const ownerPhone = "5598999942905";

const message =

`📅 NOVO AGENDAMENTO

👤 Cliente: ${clientName}

📞 Telefone: ${clientPhone}

📌 Evento: ${title}

⏰ Data: ${date}

Sistema LeoTecnologia`;

const url =

`https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;

window.open(url,"_blank");

}

</script>
