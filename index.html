<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Agenda Inteligente</title>

<!-- FULLCALENDAR -->

<link
href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
rel="stylesheet">

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

/* BODY */

body{

    background:
    linear-gradient(
    135deg,
    #020617,
    #0f172a,
    #1e3a8a
    );

    min-height:100vh;

    color:white;

    overflow-x:hidden;

    padding:6px;
}

/* CONTAINER */

.container{

    width:100%;

    max-width:100%;

    margin:auto;
}

/* HEADER */

.company-header{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    border-radius:18px;

    padding:12px;

    margin-bottom:8px;

    text-align:center;

    border:1px solid rgba(255,255,255,0.1);
}

/* LOGO */

.logo-space{

    width:70px;

    height:70px;

    margin:auto;

    margin-bottom:8px;

    border-radius:18px;

    overflow:hidden;

    background:rgba(255,255,255,0.08);

    display:flex;

    align-items:center;

    justify-content:center;
}

.logo-space img{

    width:100%;

    height:100%;

    object-fit:cover;
}

/* NOME */

.company-name{

    font-size:22px;

    font-weight:bold;

    margin-bottom:5px;

    background:
    linear-gradient(
    90deg,
    #00c6ff,
    #0072ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

/* INFO */

.company-info{

    font-size:12px;

    line-height:1.5;

    opacity:0.9;
}

/* IDIOMA */

.language-box{

    margin-top:8px;
}

.language-box select{

    width:100%;

    padding:10px;

    border:none;

    border-radius:10px;

    background:#0f172a;

    color:white;

    font-size:13px;
}

/* CALENDÁRIO */

.calendar-box{

    background:white;

    border-radius:18px;

    padding:5px;

    overflow:hidden;

    margin-bottom:8px;
}

/* FULLCALENDAR */

.fc{

    color:black;

    font-size:12px;
}

.fc-toolbar{

    display:flex !important;

    flex-direction:column !important;

    gap:5px;
}

.fc-toolbar-title{

    font-size:15px !important;

    text-align:center;
}

/* BOTÕES */

.fc-button{

    border:none !important;

    background:#2563eb !important;

    border-radius:8px !important;

    padding:5px 8px !important;

    font-size:11px !important;
}

/* EVENTOS */

.fc-event{

    background:#ff4d4d !important;

    border:none !important;

    color:white !important;

    font-size:10px !important;

    border-radius:6px !important;

    padding:2px !important;
}

/* DIA ATUAL */

.fc-day-today{

    background:#2563eb20 !important;
}

/* FORM */

.event-form{

    background:rgba(255,255,255,0.08);

    padding:12px;

    border-radius:18px;

    backdrop-filter:blur(10px);
}

/* TÍTULO */

.event-form h2{

    margin-bottom:10px;

    font-size:18px;

    text-align:center;
}

/* STATUS */

.status-box{

    display:flex;

    gap:5px;

    margin-bottom:10px;
}

.status-green,
.status-red{

    flex:1;

    padding:8px;

    border-radius:10px;

    text-align:center;

    font-size:11px;

    font-weight:bold;
}

.status-green{

    background:#00cc66;
}

.status-red{

    background:#ff4d4d;
}

/* INPUTS */

input,
select{

    width:100%;

    padding:10px;

    margin-bottom:8px;

    border:none;

    border-radius:10px;

    font-size:13px;

    outline:none;
}

/* BOTÃO */

button{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    font-size:14px;

    font-weight:bold;

    background:
    linear-gradient(
    90deg,
    #00c6ff,
    #0072ff
    );

    color:white;

    cursor:pointer;
}

/* RESPONSIVO */

@media(max-width:480px){

    .company-name{

        font-size:20px;
    }

    .fc-toolbar-title{

        font-size:13px !important;
    }

    .fc-button{

        font-size:10px !important;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="company-header">

<div class="logo-space">

<img src="logo.png" alt="Logo">

</div>

<div class="company-name">

Agenda Inteligente

</div>

<div class="company-info">

📅 Sistema Online de Agendamentos

</div>

<div class="language-box">

<select id="languageSwitcher">

<option value="pt">
🇧🇷 Português
</option>

<option value="en">
🇺🇸 English
</option>

</select>

</div>

</div>

<!-- CALENDÁRIO -->

<div class="calendar-box">

<div id="calendar"></div>

</div>

<!-- FORM -->

<div class="event-form">

<h2 id="formTitle">

📅 Novo Agendamento

</h2>

<div class="status-box">

<div class="status-green">

🟢 Livre

</div>

<div class="status-red">

🔴 Ocupado

</div>

</div>

<input
type="text"
id="clientName"
placeholder="Nome do Cliente">

<input
type="tel"
id="clientPhone"
placeholder="Telefone">

<input
type="text"
id="title"
placeholder="Evento">

<input
type="datetime-local"
id="start">

<button
onclick="addEvent()"
id="saveButton">

Salvar Agendamento

</button>

</div>

</div>

<!-- FULLCALENDAR -->

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

/* TRADUÇÕES */

const translations = {

pt:{

formTitle:"📅 Novo Agendamento",

save:"Salvar Agendamento",

alertFill:"Preencha todos os campos!",

alertSaved:"Agendamento salvo!",

deleteConfirm:"Deseja excluir este evento?"
},

en:{

formTitle:"📅 New Appointment",

save:"Save Appointment",

alertFill:"Fill all fields!",

alertSaved:"Appointment saved!",

deleteConfirm:"Delete this event?"
}

};

let currentLang = "pt";

/* TROCAR IDIOMA */

document
.getElementById("languageSwitcher")
.addEventListener("change",function(){

currentLang = this.value;

updateLanguage();

});

function updateLanguage(){

document
.getElementById("formTitle")
.innerText =
translations[currentLang].formTitle;

document
.getElementById("saveButton")
.innerText =
translations[currentLang].save;

calendar.setOption(
"locale",
currentLang === "pt"
? "pt-br"
: "en"
);

}

/* CALENDÁRIO */

let calendar;

document.addEventListener(
'DOMContentLoaded',
function(){

const calendarEl =
document.getElementById('calendar');

calendar =
new FullCalendar.Calendar(
calendarEl,
{

initialView:'timeGridWeek',

locale:'pt-br',

editable:true,

selectable:true,

allDaySlot:false,

slotMinTime:"08:00:00",

slotMaxTime:"22:00:00",

slotDuration:"00:30:00",

height:"auto",

headerToolbar:{

left:'prev,next',

center:'title',

right:'today'
},

events:
JSON.parse(
localStorage.getItem("eventos")
) || [],

/* CLICAR NO HORÁRIO */

select:function(info){

document
.getElementById("start")
.value =
formatDate(info.start);

},

/* EXCLUIR */

eventClick:function(info){

if(confirm(
translations[currentLang]
.deleteConfirm
)){

info.event.remove();

saveEvents();

}

}

});

calendar.render();

});

/* FORMATAR DATA */

function formatDate(date){

const pad =
n => n.toString()
.padStart(2,'0');

return `${date.getFullYear()}-${
pad(date.getMonth()+1)}-${
pad(date.getDate())}T${
pad(date.getHours())}:${
pad(date.getMinutes())}`;

}

/* ADICIONAR EVENTO */

function addEvent(){

const clientName =
document
.getElementById("clientName")
.value;

const clientPhone =
document
.getElementById("clientPhone")
.value;

const title =
document
.getElementById("title")
.value;

const start =
document
.getElementById("start")
.value;

if(
clientName === "" ||
clientPhone === "" ||
title === "" ||
start === ""
){

alert(
translations[currentLang]
.alertFill
);

return;

}

/* TEXTO */

const fullTitle =

`${title}
👤 ${clientName}`;

/* ADICIONAR */

calendar.addEvent({

title:fullTitle,

start:start,

color:"#ff4d4d"

});

saveEvents();

/* WHATSAPP */

sendWhatsAppToOwner(
clientName,
clientPhone,
title,
start
);

alert(
translations[currentLang]
.alertSaved
);

/* LIMPAR */

document
.getElementById("clientName")
.value = "";

document
.getElementById("clientPhone")
.value = "";

document
.getElementById("title")
.value = "";

document
.getElementById("start")
.value = "";

}

/* SALVAR */

function saveEvents(){

const events = [];

calendar.getEvents()
.forEach(event => {

events.push({

title:event.title,

start:event.start,

color:"#ff4d4d"

});

});

localStorage.setItem(
"eventos",
JSON.stringify(events)
);

}

/* WHATSAPP */

function sendWhatsAppToOwner(
clientName,
clientPhone,
title,
date
){

const ownerPhone =
"5598999999999";

const message =

`📅 NOVO AGENDAMENTO

👤 Cliente: ${clientName}

📞 Telefone: ${clientPhone}

📌 Evento: ${title}

⏰ Data: ${date}`;

const url =

`https://wa.me/${
ownerPhone
}?text=${
encodeURIComponent(message)
}`;

window.open(url,"_blank");

}

</script>

</body>
</html>
