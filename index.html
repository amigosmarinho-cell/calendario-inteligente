<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Agenda Empresarial</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
    padding:10px;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:500px;
    margin:auto;
}

/* HEADER EMPRESA */

.company-header{
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius:25px;
    padding:20px;
    margin-bottom:15px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.1);
}

/* LOGO */

.logo-space{
    width:100px;
    height:100px;
    margin:auto;
    margin-bottom:15px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:2px dashed rgba(255,255,255,0.3);
}

.logo-space img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.logo-text{
    font-size:13px;
    opacity:0.7;
}

/* EMPRESA */

.company-name{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.company-info{
    font-size:14px;
    opacity:0.9;
    line-height:1.8;
}

/* CALENDARIO */

.calendar-box{
    background:white;
    border-radius:25px;
    padding:10px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

#calendar{
    width:100%;
}

/* FULLCALENDAR */

.fc{
    color:black;
}

.fc-toolbar-title{
    font-size:18px !important;
}

.fc-button{
    border-radius:10px !important;
}

/* FORM */

.event-form{
    margin-top:15px;
    background:rgba(255,255,255,0.08);
    padding:20px;
    border-radius:25px;
    backdrop-filter: blur(10px);
}

.event-form h2{
    margin-bottom:15px;
    font-size:22px;
}

input,
select,
button{
    width:100%;
    margin-bottom:12px;
    border:none;
    border-radius:14px;
    padding:14px;
    font-size:16px;
}

input,
select{
    background:white;
}

button{
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.02);
}

.color-preview{
    height:40px;
    border-radius:12px;
    margin-bottom:12px;
}

/* RESPONSIVO */

@media(max-width:500px){

    body{
        padding:5px;
    }

    .container{
        max-width:100%;
    }

    .fc-toolbar{
        display:flex !important;
        flex-direction:column !important;
        gap:10px;
    }

    .fc-header-toolbar{
        padding:10px 0;
    }

    .company-name{
        font-size:22px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER EMPRESA -->

    <div class="company-header">

        <div class="logo-space">
            <!-- INSERIR LOGO -->
            <!-- Exemplo -->
            <!-- <img src="logo.png"> -->

            <span class="logo-text">
                SUA LOGO
            </span>
        </div>

        <div class="company-name">
            Nome da Empresa
        </div>

        <div class="company-info">
            📍 Endereço da empresa<br>
            📞 (99) 99999-9999<br>
            ✉️ empresa@email.com<br>
            🌐 www.seusite.com.br
        </div>

    </div>

    <!-- CALENDÁRIO -->

    <div class="calendar-box">
        <div id="calendar"></div>
    </div>

    <!-- FORMULÁRIO -->

    <div class="event-form">

        <h2>📅 Novo Agendamento</h2>

        <input type="text" id="title" placeholder="Nome do evento">

        <input type="datetime-local" id="start">

        <select id="color">
            <option value="#ff4d4d">🔴 Vermelho</option>
            <option value="#00cc66">🟢 Verde</option>
            <option value="#4d79ff">🔵 Azul</option>
            <option value="#ffcc00">🟡 Amarelo</option>
            <option value="#cc66ff">🟣 Roxo</option>
        </select>

        <div class="color-preview" id="preview"></div>

        <button onclick="addEvent()">
            Salvar Agendamento
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

let calendar;

document.addEventListener('DOMContentLoaded', function () {

    const calendarEl = document.getElementById('calendar');

    calendar = new FullCalendar.Calendar(calendarEl, {

        initialView: 'dayGridMonth',

        locale: 'pt-br',

        editable:true,

        selectable:true,

        height:"auto",

        headerToolbar:{
            left:'prev,next',
            center:'title',
            right:'today'
        },

        events: JSON.parse(localStorage.getItem("eventos")) || [],

        eventClick:function(info){

            if(confirm("Deseja excluir este evento?")){

                info.event.remove();

                saveEvents();
            }
        },

        eventChange:function(){

            saveEvents();
        }

    });

    calendar.render();

    document.getElementById("preview").style.background =
    document.getElementById("color").value;

});

/* ALTERAR PREVIEW DA COR */

document.getElementById("color").addEventListener("change", function(){

    document.getElementById("preview").style.background =
    this.value;
});

/* ADICIONAR EVENTO */

function addEvent(){

    const title =
    document.getElementById("title").value;

    const start =
    document.getElementById("start").value;

    const color =
    document.getElementById("color").value;

    if(title === "" || start === ""){

        alert("Preencha todos os campos!");

        return;
    }

    calendar.addEvent({

        title,
        start,
        color
    });

    saveEvents();

    scheduleNotification(title,start);

    alert("Agendamento salvo!");

    document.getElementById("title").value = "";

    document.getElementById("start").value = "";
}

/* SALVAR */

function saveEvents(){

    const events = [];

    calendar.getEvents().forEach(event => {

        events.push({

            title:event.title,
            start:event.start,
            color:event.backgroundColor
        });

    });

    localStorage.setItem("eventos",JSON.stringify(events));
}

/* NOTIFICAÇÃO */

function scheduleNotification(title,start){

    const eventTime =
    new Date(start).getTime();

    const now =
    new Date().getTime();

    const delay = eventTime - now;

    if(delay > 0){

        Notification.requestPermission().then(permission => {

            if(permission === "granted"){

                setTimeout(() => {

                    new Notification("⏰ Lembrete",{

                        body:title
                    });

                },delay);

            }

        });

    }

}

</script>

</body>
</html>
