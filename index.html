<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Agenda Inteligente</title>

<!-- GOOGLE FONTS -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- FULLCALENDAR -->

<link
href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
rel="stylesheet">

<!-- CSS -->

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="company-header">

<div class="logo-space">

<img src="logo.png"
alt="Logo">

</div>

<div class="company-name">

Agenda Inteligente

</div>

<div class="company-info">

Sistema Premium de Agendamentos

</div>

</div>

<!-- CALENDÁRIO -->

<div class="calendar-box">

<div id="calendar"></div>

</div>

<!-- FORMULÁRIO -->

<div class="event-form">

<h2>

<i class="fa-solid fa-calendar-check"></i>

Novo Agendamento

</h2>

<!-- STATUS -->

<div class="status-box">

<div class="status available-status">

🟢 Disponível

</div>

<div class="status busy-status">

🔴 Ocupado

</div>

</div>

<!-- HORÁRIOS -->

<div class="available-times">

<h3>

🕒 Horários Disponíveis

</h3>

<div class="times-grid">

<button class="time-slot"
onclick="selectTime('08:00')">
08:00
</button>

<button class="time-slot"
onclick="selectTime('09:00')">
09:00
</button>

<button class="time-slot"
onclick="selectTime('10:00')">
10:00
</button>

<button class="time-slot"
onclick="selectTime('11:00')">
11:00
</button>

<button class="time-slot"
onclick="selectTime('13:00')">
13:00
</button>

<button class="time-slot"
onclick="selectTime('14:00')">
14:00
</button>

<button class="time-slot"
onclick="selectTime('15:00')">
15:00
</button>

<button class="time-slot"
onclick="selectTime('16:00')">
16:00
</button>

<button class="time-slot"
onclick="selectTime('17:00')">
17:00
</button>

</div>

</div>

<!-- SERVIÇOS -->

<select id="serviceType">

<option value="">
🛠️ Tipo de Serviço
</option>

<option value="Suporte Técnico">
💻 Suporte Técnico
</option>

<option value="Instalação">
🖥️ Instalação
</option>

<option value="Manutenção">
🔧 Manutenção
</option>

<option value="Consultoria">
📊 Consultoria
</option>

</select>

<!-- INPUTS -->

<input
type="text"
id="clientName"
placeholder="👤 Nome do Cliente">

<input
type="tel"
id="clientPhone"
placeholder="📞 Telefone">

<input
type="text"
id="title"
placeholder="📌 Descrição do Evento">

<input
type="datetime-local"
id="start">

<!-- BOTÃO -->

<button onclick="addEvent()">

Salvar Agendamento

</button>

</div>

</div>

<!-- MODAL -->

<div id="eventModal"
class="modal">

<div class="modal-content">

<span class="close-modal"
onclick="closeModal()">

&times;

</span>

<h2>

📅 Detalhes do Agendamento

</h2>

<div class="modal-info">

<p id="modalTitle"></p>

<p id="modalDate"></p>

</div>

<button class="delete-btn"
onclick="deleteSelectedEvent()">

🗑️ Deletar Agendamento

</button>

</div>

</div>

<!-- FULLCALENDAR -->

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

let calendar;

let selectedEvent = null;

/* =========================================
   CALENDÁRIO
========================================= */

document.addEventListener(
'DOMContentLoaded',
function(){

const calendarEl =
document.getElementById('calendar');

calendar =
new FullCalendar.Calendar(
calendarEl,
{

initialView:
window.innerWidth < 768
? 'timeGridDay'
: 'timeGridWeek',

locale:'pt-br',

editable:true,

selectable:true,

allDaySlot:false,

slotMinTime:"08:00:00",

slotMaxTime:"22:00:00",

slotDuration:"00:30:00",

height:"auto",

headerToolbar:{

left:'prev,next',

center:'title',

right:'today'
},

events:
JSON.parse(
localStorage.getItem("eventos")
) || [],

/* SELECIONAR HORÁRIO */

select:function(info){

document
.getElementById("start")
.value =
formatDate(info.start);

},

/* ABRIR MODAL */

eventClick:function(info){

selectedEvent =
info.event;

document
.getElementById("modalTitle")
.innerHTML =

`<strong>Evento:</strong><br>
${info.event.title}`;

document
.getElementById("modalDate")
.innerHTML =

`<strong>Data:</strong><br>
${info.event.start.toLocaleString()}`;

document
.getElementById("eventModal")
.style.display = "flex";

}

});

calendar.render();

});

/* =========================================
   FORMATAR DATA
========================================= */

function formatDate(date){

const pad =
n => n.toString()
.padStart(2,'0');

return `${date.getFullYear()}-${
pad(date.getMonth()+1)}-${
pad(date.getDate())}T${
pad(date.getHours())}:${
pad(date.getMinutes())}`;

}

/* =========================================
   SELECIONAR HORÁRIO
========================================= */

function selectTime(time){

const currentDate =
new Date();

const year =
currentDate.getFullYear();

const month =
String(
currentDate.getMonth()+1
).padStart(2,'0');

const day =
String(
currentDate.getDate()
).padStart(2,'0');

document.getElementById("start")
.value =
`${year}-${month}-${day}T${time}`;

}

/* =========================================
   ADICIONAR EVENTO
========================================= */

function addEvent(){

const clientName =
document
.getElementById("clientName")
.value;

const clientPhone =
document
.getElementById("clientPhone")
.value;

const serviceType =
document
.getElementById("serviceType")
.value;

const title =
document
.getElementById("title")
.value;

const start =
document
.getElementById("start")
.value;

if(
clientName === "" ||
clientPhone === "" ||
serviceType === "" ||
title === "" ||
start === ""
){

alert(
"Preencha todos os campos!"
);

return;
}

const fullTitle =

`${serviceType}
👤 ${clientName}`;

calendar.addEvent({

title:fullTitle,

start:start,

color:"#ff4d4d"

});

saveEvents();

blockTime(start);

sendWhatsAppToOwner(
clientName,
clientPhone,
serviceType,
start
);

alert(
"Agendamento salvo!"
);

/* LIMPAR */

document
.getElementById("clientName")
.value = "";

document
.getElementById("clientPhone")
.value = "";

document
.getElementById("title")
.value = "";

document
.getElementById("start")
.value = "";

}

/* =========================================
   SALVAR
========================================= */

function saveEvents(){

const events = [];

calendar.getEvents()
.forEach(event => {

events.push({

title:event.title,

start:event.start,

color:"#ff4d4d"

});

});

localStorage.setItem(
"eventos",
JSON.stringify(events)
);

}

/* =========================================
   BLOQUEAR HORÁRIO
========================================= */

function blockTime(start){

const time =
start.split("T")[1];

document
.querySelectorAll(".time-slot")
.forEach(btn => {

if(btn.innerText === time){

btn.classList.add(
"occupied"
);

btn.innerText =
"Ocupado";

}

});

}

/* =========================================
   WHATSAPP
========================================= */

function sendWhatsAppToOwner(
clientName,
clientPhone,
serviceType,
date
){

const ownerPhone =
"5598999942905";

const message =

`📅 NOVO AGENDAMENTO

👤 Cliente: ${clientName}

📞 Telefone: ${clientPhone}

🛠️ Serviço: ${serviceType}

⏰ Data: ${date}`;

const url =

`https://wa.me/${
ownerPhone
}?text=${
encodeURIComponent(message)
}`;

window.open(url,"_blank");

}

/* =========================================
   FECHAR MODAL
========================================= */

function closeModal(){

document
.getElementById("eventModal")
.style.display = "none";

}

/* =========================================
   DELETAR EVENTO
========================================= */

function deleteSelectedEvent(){

if(selectedEvent){

selectedEvent.remove();

saveEvents();

closeModal();

alert(
"Agendamento deletado!"
);

}

}

/* =========================================
   FECHAR MODAL AO CLICAR FORA
========================================= */

window.onclick = function(event){

const modal =
document.getElementById("eventModal");

if(event.target === modal){

closeModal();

}

}

</script>

</body>
</html>
