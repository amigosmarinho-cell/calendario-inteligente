<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Agenda Inteligente</title>

<!-- GOOGLE FONTS -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- FULLCALENDAR -->

<link
href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
rel="stylesheet">

<!-- CSS -->

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<!-- =========================================
HEADER
========================================= -->

<div class="company-header">

<div class="company-name">

Agenda Inteligente

</div>

<div class="company-info">

<p>

<i class="fa-solid fa-location-dot"></i>

Seu Endereço

</p>

<p>

<i class="fa-solid fa-phone"></i>

(99) 99999-9999

</p>

<p>

<i class="fa-brands fa-instagram"></i>

@instagram

</p>

</div>

</div>

<!-- =========================================
CALENDÁRIO
========================================= -->

<div class="calendar-box">

<div id="calendar"></div>

</div>

<!-- =========================================
FORMULÁRIO
========================================= -->

<div class="event-form">

<h2>

📅 Novo Agendamento

</h2>

<!-- STATUS -->

<div class="status-box">

<div class="status available-status">

🟢 Disponível

</div>

<div class="status busy-status">

🔴 Ocupado

</div>

</div>

<!-- HORÁRIOS -->

<div class="available-times">

<h3>

🕒 Horários Disponíveis

</h3>

<div class="times-grid">

<button class="time-slot"
data-time="08:00"
onclick="selectTime('08:00')">
08:00
</button>

<button class="time-slot"
data-time="09:00"
onclick="selectTime('09:00')">
09:00
</button>

<button class="time-slot"
data-time="10:00"
onclick="selectTime('10:00')">
10:00
</button>

<button class="time-slot"
data-time="11:00"
onclick="selectTime('11:00')">
11:00
</button>

<button class="time-slot"
data-time="13:00"
onclick="selectTime('13:00')">
13:00
</button>

<button class="time-slot"
data-time="14:00"
onclick="selectTime('14:00')">
14:00
</button>

<button class="time-slot"
data-time="15:00"
onclick="selectTime('15:00')">
15:00
</button>

<button class="time-slot"
data-time="16:00"
onclick="selectTime('16:00')">
16:00
</button>

<button class="time-slot"
data-time="17:00"
onclick="selectTime('17:00')">
17:00
</button>

</div>

</div>

<!-- SERVIÇOS -->

<select id="serviceType">

<option value="">
🛠️ Tipo de Serviço
</option>

<option value="Suporte Técnico">
💻 Suporte Técnico
</option>

<option value="Instalação">
🖥️ Instalação
</option>

<option value="Manutenção">
🔧 Manutenção
</option>

<option value="Designer">
🎨 Designer Gráfico
</option>

</select>

<!-- INPUTS -->

<input
type="text"
id="clientName"
placeholder="👤 Nome do Cliente">

<input
type="tel"
id="clientPhone"
placeholder="📞 Telefone">

<textarea
id="description"
placeholder="📝 Descrição do Serviço"
rows="3"></textarea>

<input
type="datetime-local"
id="start">

<!-- BOTÃO -->

<button onclick="addEvent()">

Salvar Agendamento

</button>

</div>

</div>

<!-- =========================================
MODAL
========================================= -->

<div id="eventModal"
class="modal">

<div class="modal-content">

<span class="close-modal"
onclick="closeModal()">

&times;

</span>

<h2>

📅 Detalhes do Agendamento

</h2>

<div class="modal-info">

<p id="modalTitle"></p>

<p id="modalDescription"></p>

<p id="modalDate"></p>

</div>

<button class="delete-btn"
onclick="deleteSelectedEvent()">

🗑️ Deletar Agendamento

</button>

</div>

</div>

<!-- =========================================
FULLCALENDAR
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

let calendar;

let selectedEvent = null;

/* =========================================
INICIAR CALENDÁRIO
========================================= */

document.addEventListener(
'DOMContentLoaded',
function(){

const calendarEl =
document.getElementById('calendar');

calendar =
new FullCalendar.Calendar(
calendarEl,
{

initialView:
window.innerWidth < 768
? 'timeGridDay'
: 'timeGridWeek',

locale:'pt-br',

editable:true,

selectable:true,

allDaySlot:false,

slotMinTime:"08:00:00",

slotMaxTime:"22:00:00",

slotDuration:"01:00:00",

height:320,

headerToolbar:{

left:'prev,next',

center:'title',

right:'today'
},

events:
JSON.parse(
localStorage.getItem("eventos")
) || [],

/* SELECIONAR HORÁRIO */

select:function(info){

document
.getElementById("start")
.value =
formatDate(info.start);

},

/* CLICAR EVENTO */

eventClick:function(info){

selectedEvent =
info.event;

document
.getElementById("modalTitle")
.innerHTML =

`<strong>Cliente:</strong><br>
${info.event.title}`;

document
.getElementById("modalDescription")
.innerHTML =

`<strong>Descrição:</strong><br>
${info.event.extendedProps.description}`;

document
.getElementById("modalDate")
.innerHTML =

`<strong>Data:</strong><br>
${info.event.start.toLocaleString()}`;

document
.getElementById("eventModal")
.style.display = "flex";

}

});

calendar.render();

updateOccupiedTimes();

});

/* =========================================
FORMATAR DATA
========================================= */

function formatDate(date){

const pad =
n => n.toString()
.padStart(2,'0');

return `${date.getFullYear()}-${
pad(date.getMonth()+1)}-${
pad(date.getDate())}T${
pad(date.getHours())}:${
pad(date.getMinutes())}`;

}

/* =========================================
SELECIONAR HORÁRIO
========================================= */

function selectTime(time){

const currentDate =
new Date();

const year =
currentDate.getFullYear();

const month =
String(
currentDate.getMonth()+1
).padStart(2,'0');

const day =
String(
currentDate.getDate()
).padStart(2,'0');

document
.getElementById("start")
.value =

`${year}-${month}-${day}T${time}`;

}

/* =========================================
VERIFICAR HORÁRIO OCUPADO
========================================= */

function isTimeOccupied(start){

const events =
calendar.getEvents();

for(let event of events){

const eventDate =
new Date(event.start);

const newDate =
new Date(start);

if(
eventDate.getFullYear() === newDate.getFullYear()
&&
eventDate.getMonth() === newDate.getMonth()
&&
eventDate.getDate() === newDate.getDate()
&&
eventDate.getHours() === newDate.getHours()
){

return true;

}

}

return false;

}

/* =========================================
ATUALIZAR HORÁRIOS
========================================= */

function updateOccupiedTimes(){

const buttons =
document.querySelectorAll(".time-slot");

buttons.forEach(btn=>{

btn.classList.remove("occupied");

btn.innerHTML =
btn.dataset.time;

});

calendar.getEvents()
.forEach(event=>{

const hour =
String(
new Date(event.start)
.getHours()
).padStart(2,'0') + ":00";

buttons.forEach(btn=>{

if(btn.dataset.time === hour){

btn.classList.add("occupied");

btn.innerHTML =
"🔴 Ocupado";

}

});

});

}

/* =========================================
ADICIONAR EVENTO
========================================= */

function addEvent(){

const clientName =
document
.getElementById("clientName")
.value;

const clientPhone =
document
.getElementById("clientPhone")
.value;

const serviceType =
document
.getElementById("serviceType")
.value;

const description =
document
.getElementById("description")
.value;

const start =
document
.getElementById("start")
.value;

if(
clientName === "" ||
clientPhone === "" ||
serviceType === "" ||
description === "" ||
start === ""
){

alert(
"Preencha todos os campos!"
);

return;
}

/* VERIFICAR HORÁRIO */

if(isTimeOccupied(start)){

alert(
"❌ Este horário já está ocupado e agendado!"
);

return;

}

/* ADICIONAR EVENTO */

calendar.addEvent({

title:
`${serviceType} - ${clientName}`,

start:start,

description:description,

color:"#ef4444"

});

saveEvents();

updateOccupiedTimes();

/* WHATSAPP */

sendWhatsAppToOwner(
clientName,
clientPhone,
serviceType,
description,
start
);

alert(
"✅ Agendamento salvo!"
);

/* LIMPAR */

document
.getElementById("clientName")
.value = "";

document
.getElementById("clientPhone")
.value = "";

document
.getElementById("description")
.value = "";

document
.getElementById("start")
.value = "";

}

/* =========================================
SALVAR
========================================= */

function saveEvents(){

const events = [];

calendar.getEvents()
.forEach(event => {

events.push({

title:event.title,

start:event.start,

description:
event.extendedProps.description,

color:"#ef4444"

});

});

localStorage.setItem(
"eventos",
JSON.stringify(events)
);

}

/* =========================================
WHATSAPP
========================================= */

function sendWhatsAppToOwner(
clientName,
clientPhone,
serviceType,
description,
date
){

const ownerPhone =
"5599999999999";

const message =

`📅 NOVO AGENDAMENTO

👤 Cliente: ${clientName}

📞 Telefone: ${clientPhone}

🛠️ Serviço: ${serviceType}

📝 Descrição:
${description}

⏰ Data:
${date}`;

const url =

`https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;

window.open(url,"_blank");

}

/* =========================================
FECHAR MODAL
========================================= */

function closeModal(){

document
.getElementById("eventModal")
.style.display = "none";

}

/* =========================================
DELETAR EVENTO
========================================= */

function deleteSelectedEvent(){

if(selectedEvent){

selectedEvent.remove();

saveEvents();

updateOccupiedTimes();

closeModal();

alert(
"🗑️ Agendamento deletado!"
);

}

}

/* =========================================
FECHAR MODAL FORA
========================================= */

window.onclick = function(event){

const modal =
document.getElementById("eventModal");

if(event.target === modal){

closeModal();

}

}

</script>

</body>
</html>
