<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Agenda Inteligente</title>

<!-- GOOGLE FONTS -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- FULLCALENDAR -->

<link
href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
rel="stylesheet">

<style>

/* =========================================
RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* =========================================
BODY
========================================= */

body{

    background:
    linear-gradient(
    180deg,
    #020617,
    #0f172a,
    #111827
    );

    min-height:100vh;

    padding:8px;

    color:white;
}

/* =========================================
CONTAINER
========================================= */

.container{

    width:100%;

    max-width:430px;

    margin:auto;
}

/* =========================================
HEADER
========================================= */

.company-header{

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:
    blur(15px);

    border-radius:22px;

    padding:14px;

    margin-bottom:10px;

    text-align:center;

    border:
    1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 10px 30px rgba(0,0,0,0.35);
}

/* =========================================
LOGO
========================================= */

.logo-space{

    width:80px;

    height:80px;

    margin:auto;

    margin-bottom:10px;

    border-radius:20px;

    overflow:hidden;

    background:
    rgba(255,255,255,0.05);

    display:flex;

    align-items:center;

    justify-content:center;
}

.logo-space img{

    width:100%;

    height:100%;

    object-fit:cover;
}

/* =========================================
EMPRESA
========================================= */

.company-name{

    font-size:22px;

    font-weight:700;

    margin-bottom:10px;

    background:
    linear-gradient(
    90deg,
    #38bdf8,
    #2563eb
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.company-info{

    display:flex;

    flex-direction:column;

    gap:8px;
}

.company-info p{

    background:
    rgba(255,255,255,0.05);

    padding:10px;

    border-radius:12px;

    font-size:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;
}

.company-info i{

    color:#38bdf8;
}

/* =========================================
CALENDÁRIO
========================================= */

.calendar-box{

    background:white;

    border-radius:18px;

    padding:6px;

    margin-bottom:10px;

    overflow:hidden;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.35);
}

/* =========================================
FULLCALENDAR
========================================= */

.fc{

    font-size:10px !important;

    color:#111827;
}

.fc-toolbar{

    margin-bottom:4px !important;
}

.fc-toolbar-title{

    font-size:13px !important;

    font-weight:600;
}

.fc-button{

    padding:4px 6px !important;

    font-size:9px !important;

    border-radius:8px !important;
}

.fc td,
.fc th{

    padding:2px !important;
}

.fc-timegrid-slot{

    height:24px !important;
}

.fc-event{

    background:#ff4d4d !important;

    border:none !important;

    font-size:9px !important;

    padding:2px !important;

    border-radius:6px !important;
}

.fc-col-header-cell-cushion{

    font-size:9px !important;
}

.fc-timegrid-axis-cushion{

    font-size:8px !important;
}

/* =========================================
FORMULÁRIO
========================================= */

.event-form{

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:
    blur(15px);

    border-radius:22px;

    padding:15px;

    border:
    1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 10px 30px rgba(0,0,0,0.35);
}

.event-form h2{

    text-align:center;

    margin-bottom:14px;

    font-size:18px;
}

/* =========================================
STATUS
========================================= */

.status-box{

    display:flex;

    gap:8px;

    margin-bottom:14px;
}

.status{

    flex:1;

    text-align:center;

    padding:9px;

    border-radius:10px;

    font-size:11px;

    font-weight:600;
}

.available-status{

    background:#00c853;
}

.busy-status{

    background:#ff4d4d;
}

/* =========================================
HORÁRIOS
========================================= */

.available-times{

    margin-bottom:14px;
}

.available-times h3{

    margin-bottom:10px;

    font-size:13px;
}

.times-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:8px;
}

.time-slot{

    background:#00c853;

    color:white;

    border:none;

    padding:10px;

    border-radius:10px;

    font-size:11px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

.time-slot:hover{

    transform:scale(1.03);
}

.time-slot.occupied{

    background:#ff4d4d;
}

/* =========================================
INPUTS
========================================= */

input,
select,
textarea{

    width:100%;

    border:none;

    outline:none;

    border-radius:12px;

    padding:12px;

    margin-bottom:10px;

    font-size:12px;
}

textarea{

    resize:none;
}

/* =========================================
BOTÃO
========================================= */

button{

    width:100%;

    border:none;

    border-radius:12px;

    padding:13px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;

    font-size:13px;

    font-weight:600;

    cursor:pointer;
}

/* =========================================
MODAL
========================================= */

.modal{

    display:none;

    position:fixed;

    left:0;

    top:0;

    width:100%;

    height:100%;

    background:
    rgba(0,0,0,0.8);

    justify-content:center;

    align-items:center;

    padding:14px;

    z-index:999;
}

.modal-content{

    width:100%;

    max-width:340px;

    background:#111827;

    border-radius:20px;

    padding:20px;

    position:relative;
}

.close-modal{

    position:absolute;

    top:10px;

    right:15px;

    font-size:26px;

    cursor:pointer;
}

.modal-content h2{

    text-align:center;

    margin-bottom:16px;

    font-size:18px;
}

.modal-info{

    display:flex;

    flex-direction:column;

    gap:10px;

    margin-bottom:16px;
}

.modal-info p{

    background:
    rgba(255,255,255,0.06);

    padding:12px;

    border-radius:12px;

    line-height:1.5;

    font-size:12px;
}

.delete-btn{

    background:
    linear-gradient(
    135deg,
    #ff4d4d,
    #dc2626
    );
}

/* =========================================
RESPONSIVO
========================================= */

@media(max-width:480px){

    .fc-toolbar{

        display:flex !important;

        flex-direction:row !important;

        gap:4px;
    }

    .fc-toolbar-title{

        font-size:11px !important;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="company-header">

<div class="logo-space">

<img src="logo.png"
alt="Logo">

</div>

<div class="company-name">

Sua Empresa

</div>

<div class="company-info">

<p>

<i class="fa-solid fa-location-dot"></i>

Seu Endereço

</p>

<p>

<i class="fa-solid fa-phone"></i>

(99) 99999-9999

</p>

<p>

<i class="fa-brands fa-instagram"></i>

@instagram

</p>

</div>

</div>

<!-- CALENDÁRIO -->

<div class="calendar-box">

<div id="calendar"></div>

</div>

<!-- FORM -->

<div class="event-form">

<h2>

📅 Novo Agendamento

</h2>

<div class="status-box">

<div class="status available-status">

🟢 Disponível

</div>

<div class="status busy-status">

🔴 Ocupado

</div>

</div>

<div class="available-times">

<h3>

🕒 Horários

</h3>

<div class="times-grid">

<button class="time-slot"
onclick="selectTime('08:00')">
08:00
</button>

<button class="time-slot"
onclick="selectTime('09:00')">
09:00
</button>

<button class="time-slot"
onclick="selectTime('10:00')">
10:00
</button>

<button class="time-slot"
onclick="selectTime('11:00')">
11:00
</button>

<button class="time-slot"
onclick="selectTime('13:00')">
13:00
</button>

<button class="time-slot"
onclick="selectTime('14:00')">
14:00
</button>

<button class="time-slot"
onclick="selectTime('15:00')">
15:00
</button>

<button class="time-slot"
onclick="selectTime('16:00')">
16:00
</button>

<button class="time-slot"
onclick="selectTime('17:00')">
17:00
</button>

</div>

</div>

<select id="serviceType">

<option value="">
🛠️ Tipo de Serviço
</option>

<option value="Suporte Técnico">
💻 Suporte Técnico
</option>

<option value="Instalação">
🖥️ Instalação
</option>

<option value="Manicure">
💅 Manicure
</option>

<option value="Designer">
🎨 Designer Gráfico
</option>

</select>

<input
type="text"
id="clientName"
placeholder="👤 Nome do Cliente">

<input
type="tel"
id="clientPhone"
placeholder="📞 Telefone">

<textarea
id="description"
placeholder="📝 Descrição"
rows="3"></textarea>

<input
type="datetime-local"
id="start">

<button onclick="addEvent()">

Salvar Agendamento

</button>

</div>

</div>

<!-- MODAL -->

<div id="eventModal"
class="modal">

<div class="modal-content">

<span class="close-modal"
onclick="closeModal()">

&times;

</span>

<h2>

📅 Agendamento

</h2>

<div class="modal-info">

<p id="modalTitle"></p>

<p id="modalDescription"></p>

<p id="modalDate"></p>

</div>

<button class="delete-btn"
onclick="deleteSelectedEvent()">

🗑️ Deletar

</button>

</div>

</div>

<!-- FULLCALENDAR -->

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

let calendar;

let selectedEvent = null;

/* =========================================
INICIAR CALENDÁRIO
========================================= */

document.addEventListener(
'DOMContentLoaded',
function(){

const calendarEl =
document.getElementById('calendar');

calendar =
new FullCalendar.Calendar(
calendarEl,
{

initialView:
window.innerWidth < 768
? 'timeGridDay'
: 'timeGridWeek',

locale:'pt-br',

editable:true,

selectable:true,

allDaySlot:false,

slotMinTime:"08:00:00",

slotMaxTime:"22:00:00",

slotDuration:"01:00:00",

height:300,

headerToolbar:{

left:'prev,next',

center:'title',

right:'today'
},

events:
JSON.parse(
localStorage.getItem("eventos")
) || [],

select:function(info){

document
.getElementById("start")
.value =
formatDate(info.start);

},

eventClick:function(info){

selectedEvent =
info.event;

document
.getElementById("modalTitle")
.innerHTML =

`<strong>Cliente:</strong><br>
${info.event.title}`;

document
.getElementById("modalDescription")
.innerHTML =

`<strong>Descrição:</strong><br>
${info.event.extendedProps.description}`;

document
.getElementById("modalDate")
.innerHTML =

`<strong>Data:</strong><br>
${info.event.start.toLocaleString()}`;

document
.getElementById("eventModal")
.style.display = "flex";

}

});

calendar.render();

});

/* =========================================
FORMATAR DATA
========================================= */

function formatDate(date){

const pad =
n => n.toString()
.padStart(2,'0');

return `${date.getFullYear()}-${
pad(date.getMonth()+1)}-${
pad(date.getDate())}T${
pad(date.getHours())}:${
pad(date.getMinutes())}`;

}

/* =========================================
SELECIONAR HORÁRIO
========================================= */

function selectTime(time){

const currentDate =
new Date();

const year =
currentDate.getFullYear();

const month =
String(
currentDate.getMonth()+1
).padStart(2,'0');

const day =
String(
currentDate.getDate()
).padStart(2,'0');

document
.getElementById("start")
.value =

`${year}-${month}-${day}T${time}`;

}

/* =========================================
ADICIONAR EVENTO
========================================= */

function addEvent(){

const clientName =
document
.getElementById("clientName")
.value;

const clientPhone =
document
.getElementById("clientPhone")
.value;

const serviceType =
document
.getElementById("serviceType")
.value;

const description =
document
.getElementById("description")
.value;

const start =
document
.getElementById("start")
.value;

if(
clientName === "" ||
clientPhone === "" ||
serviceType === "" ||
description === "" ||
start === ""
){

alert(
"Preencha todos os campos!"
);

return;
}

calendar.addEvent({

title:
`${serviceType} - ${clientName}`,

start:start,

description:description,

color:"#ff4d4d"

});

saveEvents();

sendWhatsAppToOwner(
clientName,
clientPhone,
serviceType,
description,
start
);

alert(
"Agendamento salvo!"
);

/* LIMPAR */

document
.getElementById("clientName")
.value = "";

document
.getElementById("clientPhone")
.value = "";

document
.getElementById("description")
.value = "";

document
.getElementById("start")
.value = "";

}

/* =========================================
SALVAR
========================================= */

function saveEvents(){

const events = [];

calendar.getEvents()
.forEach(event => {

events.push({

title:event.title,

start:event.start,

description:
event.extendedProps.description,

color:"#ff4d4d"

});

});

localStorage.setItem(
"eventos",
JSON.stringify(events)
);

}

/* =========================================
WHATSAPP
========================================= */

function sendWhatsAppToOwner(
clientName,
clientPhone,
serviceType,
description,
date
){

const ownerPhone =
"5599999999999";

const message =

`📅 NOVO AGENDAMENTO

👤 Cliente: ${clientName}

📞 Telefone: ${clientPhone}

🛠️ Serviço: ${serviceType}

📝 Descrição:
${description}

⏰ Data:
${date}`;

const url =

`https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;

window.open(url,"_blank");

}

/* =========================================
FECHAR MODAL
========================================= */

function closeModal(){

document
.getElementById("eventModal")
.style.display = "none";

}

/* =========================================
DELETAR EVENTO
========================================= */

function deleteSelectedEvent(){

if(selectedEvent){

selectedEvent.remove();

saveEvents();

closeModal();

alert(
"Agendamento deletado!"
);

}

}

/* =========================================
FECHAR MODAL FORA
========================================= */

window.onclick = function(event){

const modal =
document.getElementById("eventModal");

if(event.target === modal){

closeModal();

}

}

</script>

</body>
</html>
