<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LeoTecnologia Agenda</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:
    linear-gradient(
    135deg,
    #020617,
    #0f172a,
    #1e3a8a
    );

    min-height:100vh;

    color:white;

    padding:10px;
}

.container{

    width:100%;
    max-width:520px;
    margin:auto;
}

.company-header{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    border-radius:30px;

    padding:25px;

    margin-bottom:15px;

    text-align:center;

    border:1px solid rgba(255,255,255,0.1);

    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.logo-space{

    width:140px;
    height:140px;

    margin:auto;
    margin-bottom:15px;

    border-radius:25px;

    overflow:hidden;

    background:rgba(255,255,255,0.05);

    display:flex;

    align-items:center;
    justify-content:center;
}

.logo-space img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.company-name{

    font-size:32px;

    font-weight:bold;

    margin-bottom:10px;

    background:
    linear-gradient(
    90deg,
    #ff6a00,
    #00a2ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.company-info{

    font-size:15px;

    line-height:1.8;

    opacity:0.95;
}

.language-box{

    margin-top:15px;
}

.language-box select{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    background:#0f172a;

    color:white;
}

.calendar-box{

    background:white;

    border-radius:25px;

    padding:10px;

    overflow:hidden;

    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.fc{

    color:black;
}

.fc-toolbar-title{

    font-size:18px !important;
}

.event-form{

    margin-top:15px;

    background:rgba(255,255,255,0.08);

    padding:20px;

    border-radius:25px;

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.1);
}

.event-form h2{

    margin-bottom:15px;

    font-size:24px;
}

input,
select,
button{

    width:100%;

    padding:14px;

    margin-bottom:12px;

    border:none;

    border-radius:14px;

    font-size:16px;
}

input,
select{

    background:white;
}

button{

    background:
    linear-gradient(
    90deg,
    #ff6a00,
    #0072ff
    );

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    transform:scale(1.02);
}

.color-preview{

    height:40px;

    border-radius:12px;

    margin-bottom:12px;
}

@media(max-width:500px){

    .company-name{

        font-size:26px;
    }

    .fc-toolbar{

        display:flex !important;

        flex-direction:column !important;

        gap:10px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="company-header">

<div class="logo-space">

<img src="logo.png" alt="LeoTecnologia">

</div>

<div class="company-name">

LeoTecnologia

</div>

<div class="company-info">

📞 (98) 99994-2905 <br>

📍 Avenida Três Qd-M Parque Araçagy <br>

✉️ leotecnologia25@gmail.com

</div>

<div class="language-box">

<select id="languageSwitcher">

<option value="pt">
🇧🇷 Português
</option>

<option value="en">
🇺🇸 English
</option>

</select>

</div>

</div>

<div class="calendar-box">

<div id="calendar"></div>

</div>

<div class="event-form">

<h2 id="formTitle">

📅 Novo Agendamento

</h2>

<input
type="text"
id="clientName"
placeholder="Nome do Cliente">

<input
type="tel"
id="clientPhone"
placeholder="Telefone do Cliente">

<input
type="text"
id="title"
placeholder="Nome do Evento">

<input
type="datetime-local"
id="start">

<select id="color">

<option value="#ff4d4d">
🔴 Vermelho
</option>

<option value="#00cc66">
🟢 Verde
</option>

<option value="#4d79ff">
🔵 Azul
</option>

<option value="#ffcc00">
🟡 Amarelo
</option>

<option value="#cc66ff">
🟣 Roxo
</option>

</select>

<div class="color-preview"
id="preview"></div>

<button onclick="addEvent()"
id="saveButton">

Salvar Agendamento

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

/* TRADUÇÕES */

const translations = {

pt:{

formTitle:"📅 Novo Agendamento",

save:"Salvar Agendamento",

alertFill:"Preencha todos os campos!",

alertSaved:"Agendamento salvo!",

deleteConfirm:"Deseja excluir este evento?"
},

en:{

formTitle:"📅 New Appointment",

save:"Save Appointment",

alertFill:"Fill all fields!",

alertSaved:"Appointment saved!",

deleteConfirm:"Do you want to delete this event?"
}

};

let currentLang = "pt";

document.getElementById("languageSwitcher")
.addEventListener("change",function(){

currentLang = this.value;

updateLanguage();

});

/* IDIOMA */

function updateLanguage(){

document.getElementById("formTitle")
.innerText =
translations[currentLang].formTitle;

document.getElementById("saveButton")
.innerText =
translations[currentLang].save;

calendar.setOption(
"locale",
currentLang === "pt" ? "pt-br" : "en"
);

}

/* CALENDÁRIO */

let calendar;

document.addEventListener('DOMContentLoaded',function(){

const calendarEl =
document.getElementById('calendar');

calendar =
new FullCalendar.Calendar(calendarEl,{

initialView:'dayGridMonth',

locale:'pt-br',

editable:true,

selectable:true,

height:"auto",

headerToolbar:{

left:'prev,next',

center:'title',

right:'today'
},

events:
JSON.parse(localStorage.getItem("eventos")) || [],

eventClick:function(info){

if(confirm(translations[currentLang].deleteConfirm)){

info.event.remove();

saveEvents();
}

},

eventChange:function(){

saveEvents();
}

});

calendar.render();

document.getElementById("preview")
.style.background =
document.getElementById("color").value;

});

/* COR */

document.getElementById("color")
.addEventListener("change",function(){

document.getElementById("preview")
.style.background =
this.value;

});

/* ADICIONAR EVENTO */

function addEvent(){

const clientName =
document.getElementById("clientName").value;

const clientPhone =
document.getElementById("clientPhone").value;

const title =
document.getElementById("title").value;

const start =
document.getElementById("start").value;

const color =
document.getElementById("color").value;

if(
clientName === "" ||
clientPhone === "" ||
title === "" ||
start === ""
){

alert(
translations[currentLang].alertFill
);

return;
}

const fullTitle =

`${title}
👤 ${clientName}
📞 ${clientPhone}`;

calendar.addEvent({

title:fullTitle,

start,

color
});

saveEvents();

/* WHATSAPP AUTOMÁTICO */

sendWhatsAppToOwner(
clientName,
clientPhone,
title,
start
);

alert(
translations[currentLang].alertSaved
);

/* LIMPAR */

document.getElementById("clientName").value = "";

document.getElementById("clientPhone").value = "";

document.getElementById("title").value = "";

document.getElementById("start").value = "";

}

/* SALVAR */

function saveEvents(){

const events = [];

calendar.getEvents().forEach(event => {

events.push({

title:event.title,

start:event.start,

color:event.backgroundColor
});

});

localStorage.setItem(
"eventos",
JSON.stringify(events)
);

}

/* WHATSAPP PROPRIETÁRIO */

function sendWhatsAppToOwner(
clientName,
clientPhone,
title,
date
){

const ownerPhone = "5598999942905";

const message =

`📅 NOVO AGENDAMENTO

👤 Cliente: ${clientName}

📞 Telefone: ${clientPhone}

📌 Evento: ${title}

⏰ Data: ${date}

Sistema LeoTecnologia`;

const url =

`https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;

window.open(url,"_blank");

}

</script>

</body>
</html>
