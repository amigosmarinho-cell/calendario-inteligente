<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Agenda Inteligente</title>

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- FULLCALENDAR -->

<link
href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
rel="stylesheet">

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BODY */

body{

    background:
    linear-gradient(
    180deg,
    #020617,
    #0f172a,
    #111827
    );

    min-height:100vh;

    color:white;

    overflow-x:hidden;

    padding:8px;
}

/* CONTAINER */

.container{

    width:100%;

    max-width:430px;

    margin:auto;
}

/* HEADER */

.company-header{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    border-radius:20px;

    padding:14px;

    margin-bottom:10px;

    text-align:center;

    border:1px solid rgba(255,255,255,0.08);

    animation:fadeUp .5s ease;
}

/* LOGO */

.logo-space{

    width:75px;

    height:75px;

    margin:auto;

    margin-bottom:10px;

    border-radius:18px;

    overflow:hidden;

    background:rgba(255,255,255,0.08);

    display:flex;

    align-items:center;

    justify-content:center;
}

.logo-space img{

    width:100%;

    height:100%;

    object-fit:cover;
}

/* TITLE */

.company-name{

    font-size:22px;

    font-weight:700;

    margin-bottom:5px;

    background:
    linear-gradient(
    90deg,
    #00c6ff,
    #0072ff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

/* INFO */

.company-info{

    font-size:12px;

    opacity:0.9;
}

/* CALENDAR */

.calendar-box{

    background:white;

    border-radius:20px;

    padding:5px;

    overflow:hidden;

    margin-bottom:10px;

    animation:fadeUp .6s ease;
}

/* FULLCALENDAR */

.fc{

    color:black;

    font-size:12px;
}

.fc-toolbar{

    display:flex !important;

    flex-direction:column !important;

    gap:6px;
}

.fc-toolbar-title{

    font-size:15px !important;

    text-align:center;
}

.fc-button{

    border:none !important;

    background:#2563eb !important;

    border-radius:10px !important;

    padding:6px 10px !important;

    font-size:11px !important;
}

/* EVENT */

.fc-event{

    background:#ff4d4d !important;

    border:none !important;

    color:white !important;

    font-size:10px !important;

    border-radius:8px !important;

    padding:2px !important;
}

/* FORM */

.event-form{

    background:rgba(255,255,255,0.08);

    padding:14px;

    border-radius:20px;

    backdrop-filter:blur(15px);

    animation:fadeUp .7s ease;
}

/* TITLE FORM */

.event-form h2{

    font-size:18px;

    margin-bottom:12px;

    text-align:center;
}

/* STATUS */

.status-box{

    display:flex;

    gap:8px;

    margin-bottom:12px;
}

.status{

    flex:1;

    text-align:center;

    padding:8px;

    border-radius:12px;

    font-size:11px;

    font-weight:600;
}

.available-status{

    background:#00c853;
}

.busy-status{

    background:#ff4d4d;
}

/* INPUTS */

input,
select{

    width:100%;

    padding:12px;

    border:none;

    border-radius:14px;

    margin-bottom:10px;

    font-size:13px;

    outline:none;

    transition:.3s;
}

input:focus,
select:focus{

    transform:scale(1.01);

    box-shadow:
    0 0 0 3px rgba(37,99,235,0.25);
}

/* BUTTON */

button{

    width:100%;

    padding:13px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

    box-shadow:
    0 10px 25px rgba(37,99,235,0.35);
}

button:hover{

    transform:translateY(-2px);
}

/* HORÁRIOS */

.available-times{

    margin-bottom:15px;
}

.available-times h3{

    margin-bottom:10px;

    font-size:15px;
}

/* GRID */

.times-grid{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:8px;
}

/* TIME BUTTON */

.time-slot{

    padding:10px;

    border:none;

    border-radius:12px;

    background:#00c853;

    color:white;

    font-size:12px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

.time-slot:hover{

    transform:scale(1.04);

    background:#2563eb;
}

/* OCCUPIED */

.time-slot.occupied{

    background:#ff4d4d;

    pointer-events:none;

    opacity:.85;
}

/* ANIMATION */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(20px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

/* RESPONSIVE */

@media(max-width:480px){

    .company-name{

        font-size:20px;
    }

    .fc-toolbar-title{

        font-size:13px !important;
    }

    .fc-button{

        font-size:10px !important;
    }
}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="company-header">

<div class="logo-space">

<img src="logo.png" alt="Logo">

</div>

<div class="company-name">

Agenda Inteligente

</div>

<div class="company-info">

Sistema Premium de Agendamentos

</div>

</div>

<!-- CALENDAR -->

<div class="calendar-box">

<div id="calendar"></div>

</div>

<!-- FORM -->

<div class="event-form">

<h2>
<i class="fa-solid fa-calendar-check"></i>
 Novo Agendamento
</h2>

<!-- STATUS -->

<div class="status-box">

<div class="status available-status">

🟢 Disponível

</div>

<div class="status busy-status">

🔴 Ocupado

</div>

</div>

<!-- HORÁRIOS -->

<div class="available-times">

<h3>

🕒 Horários Disponíveis

</h3>

<div class="times-grid">

<button class="time-slot"
onclick="selectTime('08:00')">
08:00
</button>

<button class="time-slot"
onclick="selectTime('09:00')">
09:00
</button>

<button class="time-slot"
onclick="selectTime('10:00')">
10:00
</button>

<button class="time-slot"
onclick="selectTime('11:00')">
11:00
</button>

<button class="time-slot"
onclick="selectTime('13:00')">
13:00
</button>

<button class="time-slot"
onclick="selectTime('14:00')">
14:00
</button>

<button class="time-slot"
onclick="selectTime('15:00')">
15:00
</button>

<button class="time-slot"
onclick="selectTime('16:00')">
16:00
</button>

<button class="time-slot"
onclick="selectTime('17:00')">
17:00
</button>

</div>

</div>

<!-- SERVIÇOS -->

<select id="serviceType">

<option value="">
🛠️ Tipo de Serviço
</option>

<option value="Suporte Técnico">
💻 Suporte Técnico
</option>

<option value="Instalação">
🖥️ Instalação
</option>

<option value="Manutenção">
🔧 Manutenção
</option>

<option value="Consultoria">
📊 Consultoria
</option>

</select>

<!-- INPUTS -->

<input
type="text"
id="clientName"
placeholder="👤 Nome do Cliente">

<input
type="tel"
id="clientPhone"
placeholder="📞 Telefone">

<input
type="text"
id="title"
placeholder="📌 Descrição do Evento">

<input
type="datetime-local"
id="start">

<!-- BUTTON -->

<button onclick="addEvent()">

Salvar Agendamento

</button>

</div>

</div>

<!-- FULLCALENDAR -->

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

let calendar;

/* CALENDÁRIO */

document.addEventListener(
'DOMContentLoaded',
function(){

const calendarEl =
document.getElementById('calendar');

calendar =
new FullCalendar.Calendar(
calendarEl,
{

initialView:
window.innerWidth < 768
? 'timeGridDay'
: 'timeGridWeek',

locale:'pt-br',

editable:true,

selectable:true,

allDaySlot:false,

slotMinTime:"08:00:00",

slotMaxTime:"22:00:00",

slotDuration:"00:30:00",

height:"auto",

headerToolbar:{

left:'prev,next',

center:'title',

right:'today'
},

events:
JSON.parse(
localStorage.getItem("eventos")
) || [],

select:function(info){

document
.getElementById("start")
.value =
formatDate(info.start);

},

eventClick:function(info){

if(confirm(
"Deseja excluir este evento?"
)){

info.event.remove();

saveEvents();

}

}

});

calendar.render();

});

/* FORMAT DATE */

function formatDate(date){

const pad =
n => n.toString()
.padStart(2,'0');

return `${date.getFullYear()}-${
pad(date.getMonth()+1)}-${
pad(date.getDate())}T${
pad(date.getHours())}:${
pad(date.getMinutes())}`;

}

/* SELECT TIME */

function selectTime(time){

const currentDate =
new Date();

const year =
currentDate.getFullYear();

const month =
String(
currentDate.getMonth()+1
).padStart(2,'0');

const day =
String(
currentDate.getDate()
).padStart(2,'0');

document.getElementById("start")
.value =
`${year}-${month}-${day}T${time}`;

}

/* ADD EVENT */

function addEvent(){

const clientName =
document
.getElementById("clientName")
.value;

const clientPhone =
document
.getElementById("clientPhone")
.value;

const serviceType =
document
.getElementById("serviceType")
.value;

const title =
document
.getElementById("title")
.value;

const start =
document
.getElementById("start")
.value;

if(
clientName === "" ||
clientPhone === "" ||
serviceType === "" ||
title === "" ||
start === ""
){

alert(
"Preencha todos os campos!"
);

return;
}

const fullTitle =

`${serviceType}
👤 ${clientName}`;

calendar.addEvent({

title:fullTitle,

start:start,

color:"#ff4d4d"

});

saveEvents();

blockTime(start);

sendWhatsAppToOwner(
clientName,
clientPhone,
serviceType,
start
);

alert(
"Agendamento salvo!"
);

/* LIMPAR */

document
.getElementById("clientName")
.value = "";

document
.getElementById("clientPhone")
.value = "";

document
.getElementById("title")
.value = "";

document
.getElementById("start")
.value = "";

}

/* SAVE */

function saveEvents(){

const events = [];

calendar.getEvents()
.forEach(event => {

events.push({

title:event.title,

start:event.start,

color:"#ff4d4d"

});

});

localStorage.setItem(
"eventos",
JSON.stringify(events)
);

}

/* BLOCK TIME */

function blockTime(start){

const time =
start.split("T")[1];

document
.querySelectorAll(".time-slot")
.forEach(btn => {

if(btn.innerText === time){

btn.classList.add(
"occupied"
);

btn.innerText =
"Ocupado";

}

});

}

/* WHATSAPP */

function sendWhatsAppToOwner(
clientName,
clientPhone,
serviceType,
date
){

const ownerPhone =
"5598999942905";

const message =

`📅 NOVO AGENDAMENTO

👤 Cliente: ${clientName}

📞 Telefone: ${clientPhone}

🛠️ Serviço: ${serviceType}

⏰ Data: ${date}`;

const url =

`https://wa.me/${
ownerPhone
}?text=${
encodeURIComponent(message)
}`;

window.open(url,"_blank");

}

</script>

</body>
</html>
