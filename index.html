<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agenda Inteligente PRO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/main.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;
    padding:12px;
    color:white;
    overflow-x:hidden;

    background:
    radial-gradient(circle at top,#1e3a8a,#020617);

}

/* ===== SHADERGLASS EFFECT ===== */

body::before{

    content:"";
    position:fixed;
    inset:0;

    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
    );

    pointer-events:none;
    z-index:9999;
    mix-blend-mode:overlay;
}

body::after{

    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle,
        transparent 60%,
        rgba(0,0,0,0.35)
    );

    pointer-events:none;
    z-index:9998;
}

/* ===== CONTAINER ===== */

.container{
    width:100%;
    max-width:430px;
    margin:auto;
}

/* ===== GLASS ===== */

.glass{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.1);

    box-shadow:
    0 10px 35px rgba(0,0,0,0.45),
    inset 0 0 15px rgba(255,255,255,0.03);

    border-radius:22px;
}

/* HEADER */

.company-header{

    padding:18px;
    margin-bottom:12px;
    text-align:center;
}

.company-name{

    font-size:26px;
    font-weight:700;

    background:linear-gradient(
    90deg,
    #38bdf8,
    #2563eb
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:14px;
}

.company-info{

    display:flex;
    flex-direction:column;
    gap:8px;
}

.company-info p{

    background:rgba(255,255,255,0.05);

    padding:10px;
    border-radius:12px;

    font-size:12px;
}

/* CALENDAR */

.calendar-box{

    padding:8px;
    margin-bottom:12px;
}

.fc{

    font-size:11px;
    color:white;
}

.fc-theme-standard td,
.fc-theme-standard th,
.fc-theme-standard .fc-scrollgrid{

    border-color:rgba(255,255,255,0.08);
}

.fc-toolbar-title{

    font-size:14px !important;
    color:white;
}

.fc-button{

    background:#2563eb !important;
    border:none !important;
    border-radius:8px !important;
}

.fc-event{

    border:none !important;
    border-radius:8px !important;
    font-size:10px !important;
}

/* FORM */

.event-form{

    padding:16px;
}

.event-form h2{

    text-align:center;
    margin-bottom:15px;
}

.status-box{

    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.status{

    flex:1;
    padding:10px;
    text-align:center;
    border-radius:12px;
    font-size:11px;
    font-weight:600;
}

.available-status{
    background:#00c853;
}

.busy-status{
    background:#ef4444;
}

.times-grid{

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;

    margin-bottom:15px;
}

.time-slot{

    border:none;
    padding:10px;
    border-radius:10px;
    cursor:pointer;

    background:#00c853;
    color:white;

    transition:.3s;
}

.time-slot:hover{

    transform:scale(1.04);
}

.time-slot.occupied{

    background:#ef4444;
}

/* INPUTS */

input,
select,
textarea{

    width:100%;
    border:none;
    outline:none;

    padding:12px;
    margin-bottom:10px;

    border-radius:12px;

    background:rgba(255,255,255,0.08);

    color:white;
}

input::placeholder,
textarea::placeholder{

    color:#ddd;
}

textarea{

    resize:none;
}

/* BUTTON */

.main-btn{

    width:100%;
    border:none;

    padding:14px;

    border-radius:12px;

    background:linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
    );

    color:white;
    font-weight:600;
    cursor:pointer;
}

/* MODAL */

.modal{

    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.8);

    justify-content:center;
    align-items:center;

    z-index:99999;
}

.modal-content{

    width:90%;
    max-width:350px;

    padding:20px;
    position:relative;
}

.close-modal{

    position:absolute;
    right:15px;
    top:10px;

    font-size:28px;
    cursor:pointer;
}

.modal-info{

    display:flex;
    flex-direction:column;
    gap:10px;

    margin:15px 0;
}

.modal-info p{

    background:rgba(255,255,255,0.05);

    padding:12px;

    border-radius:12px;
}

.delete-btn{

    width:100%;
    border:none;

    padding:12px;

    border-radius:12px;

    background:#ef4444;

    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="company-header glass">

<div class="company-name">
Agenda Inteligente
</div>

<div class="company-info">

<p>
<i class="fa-solid fa-location-dot"></i>
São Luís - MA
</p>

<p>
<i class="fa-solid fa-phone"></i>
(98) 99999-9999
</p>

<p>
<i class="fa-brands fa-instagram"></i>
@agendainteligente
</p>

</div>
</div>

<div class="calendar-box glass">
<div id="calendar"></div>
</div>

<div class="event-form glass">

<h2>📅 Novo Agendamento</h2>

<div class="status-box">

<div class="status available-status">
🟢 Disponível
</div>

<div class="status busy-status">
🔴 Ocupado
</div>

</div>

<div class="times-grid" id="timesGrid"></div>

<select id="serviceType">

<option value="">🛠️ Tipo de Serviço</option>

<option value="Suporte Técnico">
💻 Suporte Técnico
</option>

<option value="Instalação">
🖥️ Instalação
</option>

<option value="Manutenção">
🔧 Manutenção
</option>

<option value="Designer">
🎨 Designer
</option>

</select>

<input type="text"
id="clientName"
placeholder="👤 Nome do Cliente">

<input type="tel"
id="clientPhone"
placeholder="📞 Telefone">

<textarea
id="description"
rows="3"
placeholder="📝 Descrição"></textarea>

<input type="datetime-local" id="start">

<button class="main-btn" onclick="addEvent()">
Salvar Agendamento
</button>

</div>
</div>

<div class="modal" id="eventModal">

<div class="modal-content glass">

<span class="close-modal"
onclick="closeModal()">
&times;
</span>

<h2>📅 Detalhes</h2>

<div class="modal-info">

<p id="modalTitle"></p>

<p id="modalDescription"></p>

<p id="modalDate"></p>

</div>

<button class="delete-btn"
onclick="deleteSelectedEvent()">

🗑️ Deletar

</button>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

let calendar;
let selectedEvent = null;

const ownerPassword = "123456";

const horarios = [
"08:00","09:00","10:00",
"11:00","13:00","14:00",
"15:00","16:00","17:00"
];

document.addEventListener("DOMContentLoaded",()=>{

createTimeButtons();

calendar = new FullCalendar.Calendar(
document.getElementById("calendar"),
{

initialView:
window.innerWidth < 768
? "timeGridDay"
: "timeGridWeek",

locale:"pt-br",

editable:true,

selectable:true,

allDaySlot:false,

slotMinTime:"08:00:00",

slotMaxTime:"22:00:00",

height:350,

events:
JSON.parse(localStorage.getItem("eventos")) || [],

select(info){

document.getElementById("start").value =
formatDate(info.start);

},

eventClick(info){

selectedEvent = info.event;

document.getElementById("modalTitle").innerHTML =
`<strong>Cliente:</strong><br>${info.event.title}`;

document.getElementById("modalDescription").innerHTML =
`<strong>Descrição:</strong><br>${
info.event.extendedProps.description || "Sem descrição"
}`;

document.getElementById("modalDate").innerHTML =
`<strong>Data:</strong><br>${
info.event.start.toLocaleString()
}`;

document.getElementById("eventModal").style.display = "flex";

}

});

calendar.render();

updateOccupiedTimes();

});

function createTimeButtons(){

const grid = document.getElementById("timesGrid");

horarios.forEach(time=>{

const btn = document.createElement("button");

btn.className = "time-slot";

btn.innerText = time;

btn.dataset.time = time;

btn.onclick = ()=>selectTime(time);

grid.appendChild(btn);

});

}

function formatDate(date){

return date.toISOString().slice(0,16);

}

function selectTime(time){

const today = new Date();

const yyyy = today.getFullYear();

const mm = String(today.getMonth()+1).padStart(2,"0");

const dd = String(today.getDate()).padStart(2,"0");

document.getElementById("start").value =
`${yyyy}-${mm}-${dd}T${time}`;

}

function isTimeOccupied(start){

return calendar.getEvents().some(event=>{

return new Date(event.start).getTime()
=== new Date(start).getTime();

});

}

function addEvent(){

const clientName =
document.getElementById("clientName").value.trim();

const clientPhone =
document.getElementById("clientPhone").value.trim();

const serviceType =
document.getElementById("serviceType").value;

const description =
document.getElementById("description").value.trim();

const start =
document.getElementById("start").value;

if(!clientName || !clientPhone || !serviceType || !start){

alert("Preencha os campos!");

return;

}

if(isTimeOccupied(start)){

alert("❌ Horário ocupado!");

return;

}

calendar.addEvent({

id:Date.now(),

title:`${serviceType} - ${clientName}`,

start,

description,

color:"#ef4444"

});

saveEvents();

updateOccupiedTimes();

alert("✅ Agendamento salvo!");

}

function saveEvents(){

const events = calendar.getEvents().map(event=>({

id:event.id,

title:event.title,

start:event.start,

description:event.extendedProps.description,

color:event.backgroundColor

}));

localStorage.setItem(
"eventos",
JSON.stringify(events)
);

}

function updateOccupiedTimes(){

const buttons =
document.querySelectorAll(".time-slot");

buttons.forEach(btn=>{

btn.classList.remove("occupied");

btn.innerText = btn.dataset.time;

});

calendar.getEvents().forEach(event=>{

const hour =
String(new Date(event.start).getHours())
.padStart(2,"0") + ":00";

buttons.forEach(btn=>{

if(btn.dataset.time === hour){

btn.classList.add("occupied");

btn.innerText = "🔴 Ocupado";

}

});

});

}

function closeModal(){

document.getElementById("eventModal")
.style.display = "none";

}

function deleteSelectedEvent(){

if(!selectedEvent) return;

const password =
prompt("🔒 Senha do proprietário:");

if(password !== ownerPassword){

alert("❌ Senha incorreta!");

return;

}

selectedEvent.remove();

saveEvents();

updateOccupiedTimes();

closeModal();

alert("🗑️ Evento deletado!");

}

window.onclick = function(e){

const modal =
document.getElementById("eventModal");

if(e.target === modal){

closeModal();

}

};

</script>

</body>
</html>
