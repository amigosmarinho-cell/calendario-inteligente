<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>

let calendar;
let selectedEvent = null;

const ownerPassword = "123456";

/* INICIAR */

document.addEventListener("DOMContentLoaded", function () {

    const calendarEl = document.getElementById("calendar");

    calendar = new FullCalendar.Calendar(calendarEl, {

        initialView:
            window.innerWidth < 768
                ? "timeGridDay"
                : "timeGridWeek",

        locale: "pt-br",

        editable: true,

        selectable: true,

        allDaySlot: false,

        slotMinTime: "08:00:00",

        slotMaxTime: "22:00:00",

        slotDuration: "01:00:00",

        height: 320,

        headerToolbar: {

            left: "prev,next",

            center: "title",

            right: "today"
        },

        events:
            JSON.parse(
                localStorage.getItem("eventos")
            ) || [],

        select: function (info) {

            document.getElementById("start").value =
                formatDate(info.start);

        },

        eventClick: function (info) {

            selectedEvent = info.event;

            document.getElementById("modalTitle").innerHTML = `
                <strong>Cliente:</strong><br>
                ${info.event.title}
            `;

            document.getElementById("modalDescription").innerHTML = `
                <strong>Descrição:</strong><br>
                ${info.event.extendedProps.description || "Sem descrição"}
            `;

            document.getElementById("modalDate").innerHTML = `
                <strong>Data:</strong><br>
                ${info.event.start.toLocaleString()}
            `;

            document.getElementById("eventModal")
                .style.display = "flex";
        }

    });

    calendar.render();

    updateOccupiedTimes();

});

/* FORMATAR DATA */

function formatDate(date) {

    const pad = (n) =>
        n.toString().padStart(2, "0");

    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

/* SELECIONAR HORÁRIO */

function selectTime(time) {

    const currentDate = new Date();

    const year = currentDate.getFullYear();

    const month = String(
        currentDate.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        currentDate.getDate()
    ).padStart(2, "0");

    document.getElementById("start").value =
        `${year}-${month}-${day}T${time}`;
}

/* HORÁRIO OCUPADO */

function isTimeOccupied(start) {

    const events = calendar.getEvents();

    for (let event of events) {

        const eventDate = new Date(event.start);

        const newDate = new Date(start);

        if (
            eventDate.getFullYear() === newDate.getFullYear() &&
            eventDate.getMonth() === newDate.getMonth() &&
            eventDate.getDate() === newDate.getDate() &&
            eventDate.getHours() === newDate.getHours()
        ) {

            return true;
        }
    }

    return false;
}

/* ATUALIZAR HORÁRIOS */

function updateOccupiedTimes() {

    const buttons =
        document.querySelectorAll(".time-slot");

    buttons.forEach(btn => {

        btn.classList.remove("occupied");

        btn.innerHTML = btn.dataset.time;
    });

    calendar.getEvents().forEach(event => {

        const hour =
            String(
                new Date(event.start).getHours()
            ).padStart(2, "0") + ":00";

        buttons.forEach(btn => {

            if (btn.dataset.time === hour) {

                btn.classList.add("occupied");

                btn.innerHTML = "🔴 Ocupado";
            }

        });

    });

}

/* ADICIONAR EVENTO */

function addEvent() {

    const clientName =
        document.getElementById("clientName")
            .value.trim();

    const clientPhone =
        document.getElementById("clientPhone")
            .value.trim();

    const serviceType =
        document.getElementById("serviceType")
            .value;

    const description =
        document.getElementById("description")
            .value.trim();

    const start =
        document.getElementById("start")
            .value;

    if (
        clientName === "" ||
        clientPhone === "" ||
        serviceType === "" ||
        description === "" ||
        start === ""
    ) {

        alert("Preencha todos os campos!");

        return;
    }

    if (isTimeOccupied(start)) {

        alert("❌ Este horário já está ocupado!");

        return;
    }

    calendar.addEvent({

        title: `${serviceType} - ${clientName}`,

        start: start,

        description: description,

        color: "#ef4444"

    });

    saveEvents();

    updateOccupiedTimes();

    sendWhatsAppToOwner(
        clientName,
        clientPhone,
        serviceType,
        description,
        start
    );

    alert("✅ Agendamento salvo!");

    /* LIMPAR */

    document.getElementById("clientName").value = "";

    document.getElementById("clientPhone").value = "";

    document.getElementById("description").value = "";

    document.getElementById("start").value = "";
}

/* SALVAR */

function saveEvents() {

    const events = [];

    calendar.getEvents().forEach(event => {

        events.push({

            title: event.title,

            start: event.start,

            description:
                event.extendedProps.description,

            color: "#ef4444"
        });

    });

    localStorage.setItem(
        "eventos",
        JSON.stringify(events)
    );
}

/* WHATSAPP */

function sendWhatsAppToOwner(
    clientName,
    clientPhone,
    serviceType,
    description,
    date
) {

    const ownerPhone = "5598999942905";

    const message = `
📅 *NOVO AGENDAMENTO*

👤 *Cliente:* ${clientName}

📞 *Telefone:* ${clientPhone}

🛠️ *Serviço:* ${serviceType}

📝 *Descrição:* 
${description}

⏰ *Data:* 
${new Date(date).toLocaleString()}
`;

    const url =
        `https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;

    window.open(url, "_blank");
}

/* FECHAR MODAL */

function closeModal() {

    document.getElementById("eventModal")
        .style.display = "none";
}

/* DELETAR EVENTO */

function deleteSelectedEvent() {

    if (selectedEvent) {

        const password = prompt(
            "🔒 Digite a senha do proprietário:"
        );

        if (password !== ownerPassword) {

            alert("❌ Senha incorreta!");

            return;
        }

        selectedEvent.remove();

        saveEvents();

        updateOccupiedTimes();

        closeModal();

        alert("🗑️ Agendamento deletado!");
    }
}

/* FECHAR MODAL FORA */

window.onclick = function (event) {

    const modal =
        document.getElementById("eventModal");

    if (event.target === modal) {

        closeModal();
    }
};

</script>
