<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Inteligente – LeoTecnologia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --success: #198754;
            --danger: #dc3545;
            --light: #f8f9fa;
            --dark: #212529;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0,0,0,.1);
            --font: 'Poppins', sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: var(--font);
            background: #f5f5f5;
            color: var(--dark);
            line-height: 1.4;
            font-size: 16px;
            padding-bottom: 70px; /* espaço para bottom-nav */
        }
        .container {
            max-width: 100%;
            margin: 0;
            padding: 8px;
        }

        /* HEADER */
        .company-header {
            background: white;
            padding: 12px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 8px;
            text-align: center;
        }
        .company-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        .company-info p {
            font-size: 0.85rem;
            margin: 2px 0;
        }

        /* DASHBOARD */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .card-dashboard {
            background: white;
            padding: 12px 8px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow);
        }
        .card-dashboard h3 {
            font-size: 1.2rem;
            color: var(--primary);
        }
        .card-dashboard p {
            font-size: 0.75rem;
            color: #666;
        }

        /* GARANTIAS */
        .garantia-box {
            background: white;
            padding: 12px;
            border-radius: var(--radius);
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .garantia-box h2 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .garantia-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border: 1px solid #eee;
            border-radius: var(--radius);
            margin-bottom: 6px;
            font-size: 0.85rem;
            background: var(--light);
        }
        .garantia-badge {
            padding: 2px 6px;
            border-radius: var(--radius);
            font-size: 0.7rem;
            font-weight: 600;
            color: #fff;
        }
        .garantia-badge.green { background: var(--success); }
        .garantia-badge.warning { background: #ffc107; color:#000; }
        .garantia-badge.danger { background: var(--danger); }

        /* TOP ACTIONS */
        .top-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .top-actions button,
        .top-actions input {
            flex: 1;
            padding: 10px;
            font-size: 0.85rem;
            border: none;
            border-radius: var(--radius);
        }
        .top-actions button {
            background: var(--primary);
            color: white;
            white-space: nowrap;
        }

        /* CALENDAR */
        .calendar-box {
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        #calendar {
            font-size: 0.75rem;
        }

        /* FORM */
        .event-form {
            background: white;
            padding: 12px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .event-form h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
        }
        .times-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .time-slot {
            padding: 10px 5px;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            background: #f8f9fa;
            font-size: 0.8rem;
            text-align: center;
            cursor: pointer;
        }
        .time-slot.booked {
            background: var(--danger);
            color: white;
            cursor: not-allowed;
        }
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-size: 1rem;
        }
        .button-grid {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .button-grid button {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
        }
        #saveBtn {
            background: var(--success);
            color: white;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,.5);
        }
        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: var(--radius);
            width: 95%;
            max-width: 400px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 8px; right: 12px;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* BOTTOM NAV (opcional) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0; right: 0;
            background: white;
            display: flex;
            box-shadow: 0 -2px 10px rgba(0,0,0,.1);
            z-index: 1000;
        }
        .bottom-nav button {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            font-size: 0.75rem;
        }

        /* DESKTOP */
        @media (min-width: 768px) {
            body { padding-bottom: 0; font-size: 14px; }
            .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
            .dashboard { grid-template-columns: repeat(3, 1fr); gap: 16px; }
            .times-grid { grid-template-columns: repeat(6, 1fr); }
            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .form-grid .full-width { grid-column: 1/-1; }
            .bottom-nav { display: none; }
        }

        /* TEMA ESCURO */
        body.dark-theme {
            background: #121212;
            color: #e5e5e5;
        }
        body.dark-theme .company-header,
        body.dark-theme .card-dashboard,
        body.dark-theme .garantia-box,
        body.dark-theme .calendar-box,
        body.dark-theme .event-form,
        body.dark-theme .modal-content {
            background: #1e1e1e;
            border-color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header class="company-header">
            <h1 class="company-name">LeoTecnologia</h1>
            <div class="company-info">
                <p>CNPJ: 12.345.678/0001-90</p>
                <p>WhatsApp: <a href="https://wa.me/5599999999999" target="_blank">(99) 99999-9999</a></p>
                <p>Endereço: São Luís - MA</p>
            </div>
        </header>

        <!-- DASHBOARD -->
        <section class="dashboard">
            <div class="card-dashboard">
                <h3 id="todayCount">0</h3>
                <p>Hoje</p>
            </div>
            <div class="card-dashboard">
                <h3 id="freeCount">9</h3>
                <p>Livres</p>
            </div>
            <div class="card-dashboard">
                <h3 id="clientCount">0</h3>
                <p>Clientes</p>
            </div>
        </section>

        <!-- GARANTIAS -->
        <section class="garantia-box">
            <h2>Status das Garantias</h2>
            <div class="garantia-item">
                <span>iPhone 12 – Troca de Bateria</span>
                <span class="garantia-badge green">Em garantia</span>
            </div>
            <div class="garantia-item">
                <span>Samsung A54 – Tela</span>
                <span class="garantia-badge warning">Próx. vencer</span>
            </div>
            <div class="garantia-item">
                <span>Motorola G60 – Placa</span>
                <span class="garantia-badge danger">Vencida</span>
            </div>
        </section>

        <!-- AÇÕES RÁPIDAS -->
        <section class="top-actions">
            <button onclick="toggleTheme()">🌙 Tema</button>
            <input type="search" id="searchClient" placeholder="Buscar cliente..." onkeyup="searchEvents()">
            <button onclick="exportBackup()">💾 Backup</button>
        </section>

        <!-- CALENDÁRIO -->
        <section class="calendar-box">
            <div id="calendar"></div>
        </section>

        <!-- FORMULÁRIO -->
        <section class="event-form">
            <h2>Novo Agendamento</h2>

            <label>Horários disponíveis</label>
            <div class="times-grid">
                <button class="time-slot" data-time="08:00" onclick="selectTime('08:00')">08:00</button>
                <button class="time-slot" data-time="09:00" onclick="selectTime('09:00')">09:00</button>
                <button class="time-slot" data-time="10:00" onclick="selectTime('10:00')">10:00</button>
                <button class="time-slot" data-time="11:00" onclick="selectTime('11:00')">11:00</button>
                <button class="time-slot" data-time="12:00" onclick="selectTime('12:00')">12:00</button>
                <button class="time-slot" data-time="13:00" onclick="selectTime('13:00')">13:00</button>
                <button class="time-slot" data-time="14:00" onclick="selectTime('14:00')">14:00</button>
                <button class="time-slot" data-time="15:00" onclick="selectTime('15:00')">15:00</button>
                <button class="time-slot" data-time="16:00" onclick="selectTime('16:00')">16:00</button>
            </div>

            <form onsubmit="return false;">
                <div class="form-grid">
                    <input type="datetime-local" id="start" required>
                    <select id="serviceType">
                        <option value="">Tipo de Serviço</option>
                        <option>Manutenção</option>
                        <option>Troca de Peça</option>
                        <option>Software</option>
                        <option>Orçamento</option>
                    </select>
                    <input type="text" id="clientName" placeholder="Nome do Cliente" required>
                    <input type="tel" id="clientPhone" placeholder="Telefone" required>
                    <select id="statusService" class="full-width">
                        <option value="Agendado">Agendado</option>
                        <option value="Em andamento">Em andamento</option>
                        <option value="Finalizado">Finalizado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                    <textarea id="description" class="full-width" rows="3" placeholder="Descrição do serviço..." required></textarea>
                </div>

                <div class="button-grid">
                    <button type="button" id="saveBtn" onclick="addEvent()">Salvar</button>
                    <button type="button" onclick="resetForm()">Limpar</button>
                </div>
            </form>
        </section>
    </div>

    <!-- MODAL -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle"></h3>
            <p id="modalDescription"></p>
            <p id="modalDate"></p>
            <button class="btn-danger" onclick="deleteSelectedEvent()">Excluir</button>
        </div>
    </div>

    <!-- MENU INFERIOR OPCIONAL -->
    <nav class="bottom-nav">
        <button onclick="calendar.today()">Hoje</button>
        <button onclick="calendar.prev()">◀ Anterior</button>
        <button onclick="calendar.next()">Próximo ▶</button>
    </nav>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales/pt-br.js"></script>
    <script>
        let calendar, selectedEvent;

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            initCalendar();
            loadCurrentTime();
            setInterval(loadCurrentTime, 60000);
            updateDashboard();
        });

        // Calendário
        function initCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: window.innerWidth < 768 ? 'listWeek' : 'timeGridWeek',
                locale: 'pt-br',
                height: 'auto',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: window.innerWidth < 768 ? '' : 'dayGridMonth,timeGridWeek'
                },
                slotMinTime: '08:00',
                slotMaxTime: '18:00',
                events: () => JSON.parse(localStorage.getItem('events')) || [],
                eventClick: (info) => openModal(info.event),
                datesSet: () => updateDashboard()
            });
            calendar.render();
        }

        // CRUD Eventos
        function addEvent() {
            const form = {
                title: document.getElementById('clientName').value,
                start: document.getElementById('start').value,
                description: document.getElementById('description').value,
                serviceType: document.getElementById('serviceType').value,
                status: document.getElementById('statusService').value,
                phone: document.getElementById('clientPhone').value
            };

            if (!form.title || !form.start) { alert('Preencha nome e horário'); return; }

            const events = JSON.parse(localStorage.getItem('events')) || [];
            if (events.find(e => e.start === form.start)) { alert('Horário ocupado'); return; }

            events.push({
                id: Date.now(),
                ...form,
                color: {Agendado:'#ffc107','Em andamento':'#007bff',Finalizado:'#28a745',Cancelado:'#dc3545'}[form.status]
            });

            localStorage.setItem('events', JSON.stringify(events));
            calendar.refetchEvents();
            updateDashboard();
            showToast('✅ Salvo!');
            document.querySelector('form').reset();
            loadCurrentTime();
        }

        function deleteSelectedEvent() {
            if (!selectedEvent || !confirm('Excluir?')) return;
            const events = JSON.parse(localStorage.getItem('events')) || [];
            const filtered = events.filter(e => e.id !== selectedEvent.id);
            localStorage.setItem('events', JSON.stringify(filtered));
            calendar.refetchEvents();
            updateDashboard();
            closeModal();
            showToast('🗑️ Excluído');
        }

        // Utilidades
        function loadCurrentTime() {
            const now = new Date();
            const date = now.toISOString().slice(0, 16);
            document.getElementById('start').value = date;
            updateBookedTimes();
        }
        function selectTime(time) {
            const date = document.getElementById('start').value?.split('T')[0] || new Date().toISOString().split('T')[0];
            document.getElementById('start').value = `${date}T${time}`;
            updateBookedTimes();
        }
        function updateBookedTimes() {
            const date = document.getElementById('start').value?.split('T')[0] || new Date().toISOString().split('T')[0];
            const events = JSON.parse(localStorage.getItem('events')) || [];
            document.querySelectorAll('.time-slot').forEach(slot => {
                const time = slot.dataset.time;
                const isBooked = events.some(e => e.start === `${date}T${time}`);
                slot.classList.toggle('booked', isBooked);
                slot.disabled = isBooked;
            });
        }
        function updateDashboard() {
            const today = new Date().toISOString().split('T')[0];
            const events = JSON.parse(localStorage.getItem('events')) || [];
            const todayEvents = events.filter(e => e.start?.startsWith(today));
            const freeSlots = 9 - todayEvents.length;
            const uniqueClients = [...new Set(events.map(e => e.title))];
            document.getElementById('todayCount').textContent = todayEvents.length;
            document.getElementById('freeCount').textContent = Math.max(0, freeSlots);
            document.getElementById('clientCount').textContent = uniqueClients.length;
        }
        function resetForm() {
            document.querySelector('form').reset();
            loadCurrentTime();
        }
        function showToast(msg) {
            const div = document.createElement('div');
            div.style.position='fixed'; div.style.bottom='80px'; div.style.left='50%';
            div.style.transform='translateX(-50%)'; div.style.background='var(--success)';
            div.style.color='#fff'; div.style.padding='10px 16px'; div.style.borderRadius='var(--radius)';
            div.style.zIndex='9999'; div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }
        function openModal(event) {
            selectedEvent = event;
            document.getElementById('modalTitle').textContent = event.title;
            document.getElementById('modalDescription').textContent = event.extendedProps.description || '';
            document.getElementById('modalDate').textContent = new Date(event.start).toLocaleString('pt-BR');
            document.getElementById('eventModal').style.display = 'block';
        }
        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
            selectedEvent = null;
        }
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        }
        function exportBackup() {
            const events = JSON.parse(localStorage.getItem('events')) || [];
            const blob = new Blob([JSON.stringify(events, null, 2)], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup-agenda-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }
        function searchEvents() {
            const term = document.getElementById('searchClient').value.toLowerCase();
            if (!term) return;
            const events = JSON.parse(localStorage.getItem('events')) || [];
            const found = events.find(e => e.title.toLowerCase().includes(term) || e.description.toLowerCase().includes(term));
            if (found) calendar.gotoDate(found.start);
        }
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-theme');
    </script>
</body>
</html>
